# StarSage reverse proxy - fronts the FastAPI backend container.
#
# What this does (base setup):
#   - Terminates the connection from the internet and forwards every request to the
#     "backend" service (see ../docker-compose.yml) over the private docker network.
#   - Sends X-Real-IP/X-Forwarded-For/X-Forwarded-Proto so the backend's own rate-limiting
#     (main.py's _get_client_ip()) sees the REAL visitor IP instead of this proxy's IP -
#     the backend's Dockerfile already runs uvicorn with --proxy-headers to trust this.
#     SECURITY-CRITICAL: X-Forwarded-For is set to $remote_addr (nginx's OWN view of who it's
#     talking to), NOT $proxy_add_x_forwarded_for. This nginx is the public internet-facing
#     edge (nothing else sits in front of it), so any X-Forwarded-For a client sends in their
#     original request is attacker-controlled input, not a real proxy chain to append to.
#     $proxy_add_x_forwarded_for APPENDS nginx's view onto whatever the client already sent,
#     so a request arriving as "X-Forwarded-For: 1.2.3.4" would be forwarded as
#     "1.2.3.4, <real attacker IP>" - and because the backend's uvicorn runs with
#     --forwarded-allow-ips='*' (it has to, since nginx's container IP on the Docker network
#     isn't fixed), uvicorn's ProxyHeadersMiddleware trusts the FIRST/leftmost address in that
#     list unconditionally, i.e. the attacker-forged "1.2.3.4" - completely spoofable, letting
#     an attacker evade rate-limiting/auto-blocking, or frame an innocent IP for auto-block.
#     Decisively confirmed with a real nginx + uvicorn (--proxy-headers) test: sending
#     "X-Forwarded-For: 203.0.113.99" was trusted as the client's real IP with the old
#     $proxy_add_x_forwarded_for config. Using $remote_addr instead means nginx always
#     overwrites the header with the actual TCP peer it saw - the one part of this a client
#     cannot forge - so the backend only ever sees an IP nginx itself observed directly.
#   - Raises client_max_body_size above nginx's 1m default. The backend's own middleware
#     rejects any request over 2,000,000 bytes (main.py line ~230) BEFORE reading the body,
#     and each analyze/migrate endpoint further caps the actual file content at 500,000
#     bytes - nginx's default 1m limit would silently 413 a request between 1MB and 2MB
#     before it ever reached the backend's own, more informative JSON error.
#
# Security/hardening additions below (added on top of the base setup):
#   - Nginx-level rate limiting, as a second layer in front of the backend's own
#     per-IP rate limiting (defense in depth - if nginx's limit trips, the backend never
#     even sees the request).
#   - A user-agent block for a few well-known scanner tools. NOTE: this is a weak control by
#     itself (any attacker can fake their User-Agent header in one line) - it only stops the
#     laziest/most automated scans, not a real attacker. Keep the backend's own security
#     scanning/WAF-style defenses as the real control.
#   - Structured (JSON) access logging, a dedicated Nginx-only health endpoint, gzip and
#     keepalive tuning, and tighter/looser per-endpoint request-size and timeout limits based
#     on this API's REAL routes (checked against backend/main.py's actual @app.get/@app.post
#     decorators, not guessed).
#
# This file is plain HTTP (port 80) so it works out of the box with no domain/certificate.
# See the commented-out HTTPS section at the bottom for how to add TLS once you have a real
# domain pointed at this server (DNS A record -> this server's IP).

# --- Rate limiting zones (must live at this "http" context level - conf.d/*.conf files are
# already included inside nginx.conf's http{} block, so this is the correct place) ---------
# api: general/default traffic. ai_endpoints: the two heavier, most expensive-to-run routes
# (/ai-migrate, /generate-tests - both call out to an AI provider). auth: login/register/
# logout - kept in ITS OWN zone (not shared with ai_endpoints) so a burst of AI-migration
# calls from one user can't also throttle their own login attempts, and vice versa.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ai_endpoints:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# --- Bad-bot / scanner user-agent block (weak control, see note above - kept anyway as a
# cheap first filter) ------------------------------------------------------------------------
map $http_user_agent $bad_bot {
    default 0;
    ~*sqlmap   1;
    ~*nikto    1;
    ~*nmap     1;
    ~*masscan  1;
    ~*zgrab    1;
    ~*acunetix 1;
    ~*nessus   1;
}

# --- Structured JSON access log ---------------------------------------------------------
log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"duration":"$request_time",'
    '"user_agent":"$http_user_agent"}';

# Bug (reported by the user, classic Docker+Nginx gotcha): a named upstream block's
# "server backend:8000;" is resolved to a concrete container IP ONCE, at nginx's own
# start/reload time. Docker's embedded DNS (127.0.0.11) updates the "backend" hostname's
# record immediately whenever the backend container is recreated - which happens on every
# `docker compose up -d --build backend` (i.e. every single time a new main.py fix from this
# migration tool is deployed - the normal, frequent workflow for this project) - but nginx
# itself keeps sending traffic to the STALE IP it resolved at its own last start/reload, until
# nginx is also restarted/reloaded. Until then: intermittent "connection refused"/502 errors
# that look like the backend is broken even though `docker ps`/`docker logs backend` show it
# running fine - a genuinely confusing, hard-to-diagnose gap between what's actually running
# and what nginx is still trying to reach.
# Fixed with the standard open-source-nginx workaround: a `resolver` directive pointing at
# Docker's own embedded DNS, combined with putting the backend's address in a variable rather
# than a static upstream block. nginx re-resolves a variable used in proxy_pass on every
# request (cached for `valid=10s`, so it isn't re-querying DNS on literally every single
# request) - a backend restart is picked up automatically within 10 seconds, no nginx
# reload/restart needed. (NGINX PLUS has a "resolve" parameter for upstream blocks that keeps
# both this AND upstream keepalive pooling - not available in plain nginx/the nginx:alpine
# image this project uses.)
# Trade-off: nginx's upstream keepalive (connection pooling, "keepalive 32" below) requires a
# static, named upstream block - fundamentally incompatible with per-request dynamic
# resolution, so it had to be dropped. Given how often this backend gets redeployed during
# active development, correctness (no stale-IP errors after every deploy) is worth far more
# here than reusing TCP connections to the backend - re-establishing a connection costs a few
# milliseconds; a pool of connections to a dead IP costs users real, confusing errors.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    set $backend_upstream backend:8000;

    access_log /var/log/nginx/access.log json_combined;

    client_max_body_size 3m;

    if ($bad_bot) {
        return 403;
    }

    # Hides nginx's exact version number from every response (and nginx's own default error
    # pages) - requested by the user, good practice: the stock "Server: nginx/1.x.y" header is
    # free recon for an attacker (lets them look up version-specific known CVEs instead of
    # having to guess/fingerprint), for no benefit to a legitimate client.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request-ID tracking (requested by the user): nginx's own $request_id variable (a
    # per-request UUID it generates itself, no extra module needed - confirmed present in
    # stock nginx/nginx:alpine, used nowhere else in this file yet) is returned to the client
    # AND forwarded to the backend, so one ID ties together the client-visible response, this
    # access log's JSON line, and anything the backend itself logs for that request - without
    # it, correlating a user's bug report ("my request failed around 2pm") to the matching log
    # line means grepping by approximate timestamp instead of an exact, unambiguous key.
    # add_header is inherited into every location below (none of them define their own
    # add_header, so inheritance isn't broken - see nginx's documented all-or-nothing
    # inheritance rule for add_header/proxy_set_header), but proxy_set_header must be repeated
    # in each proxy_pass location explicitly since every one of them already sets other
    # proxy_set_header directives of its own (which breaks inheritance for that directive).
    add_header X-Request-ID $request_id always;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Nginx-only health check - does NOT hit the backend, used by orchestrators/uptime
    # monitors that just need to know "is this box's web server alive".
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx status monitor (requested by the user): exposes stub_status's live connection
    # counters (active connections, total accepted/handled/requests) for a monitoring agent
    # (Prometheus nginx-exporter, Datadog, etc.) to scrape - NOT the same thing as the
    # application-level /stats endpoint main.py already serves, and not meant for a browser or
    # the public internet. ngx_http_stub_status_module ships compiled into the stock
    # nginx/nginx:alpine image used by docker-compose.yml, so this needs no extra build step.
    # "allow 127.0.0.1; deny all;" restricts it to the nginx container's own loopback - since
    # this container has no published host port for anything but 80/443 (see
    # docker-compose.yml), nothing outside this one container can reach 127.0.0.1 here anyway;
    # a monitoring sidecar that needs this would have to run `curl` from inside this same
    # container (e.g. via `docker exec`), or this rule should be loosened to that sidecar's own
    # container IP on the private compose network once one exists.
    location = /nginx-status {
        access_log off;
        stub_status on;
        allow 127.0.0.1;
        deny all;
    }

    # --- AI-backed endpoints (checked against main.py: @app.post("/ai-migrate"),
    # @app.post("/generate-tests")) - these call out to an external AI provider (see
    # AI_PROVIDER env var), so they're slower and more expensive per-request than the rest of
    # the API. Tighter rate limit, larger body allowance, longer timeout. -------------------
    location ~ ^/(ai-migrate|generate-tests)$ {
        limit_req zone=ai_endpoints burst=3 nodelay;
        client_max_body_size 5m;
        proxy_read_timeout 180s;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
    }

    # --- Auth endpoints (checked against main.py: @app.post("/auth/register"),
    # @app.post("/auth/login"), @app.post("/auth/logout")) - small payloads only, own rate
    # zone so this can't be starved by, or starve, the AI endpoints above. ------------------
    location ~ ^/auth/ {
        limit_req zone=auth burst=2 nodelay;
        client_max_body_size 100k;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin/reporting endpoints (main.py: /stats, /audit-log, /audit-log-json,
    # /security-dashboard). NOT IP-restricted yet - add your real admin IP(s) below once you
    # have them, then uncomment the "allow"/"deny" lines. Leaving this open for now (still
    # behind the general rate limit below) rather than guessing a placeholder IP, which would
    # either lock you out (wrong IP) or give a false sense of security (left as a placeholder
    # that never matches your real IP and quietly denies everyone, or worse, denies no one).
    location ~ ^/(stats|audit-log|audit-log-json|security-dashboard)$ {
        # allow YOUR.REAL.IP.HERE;
        # deny all;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- /scan-repo (checked against main.py: @app.post("/scan-repo")) - scans up to 25 files
    # from a GitHub repo and has its OWN internal time budget of 180 seconds
    # (_time_budget_seconds = 180 in _scan_repo_blocking), separate from and longer than the
    # general location's 120s timeouts below. Bug (reported by the user): without its own
    # location block, /scan-repo fell through to the general "location /" block's 120s
    # proxy_read_timeout/proxy_send_timeout - nginx would cut the connection with a 504 Gateway
    # Timeout a full minute before the backend's own 180-second budget was up, on exactly the
    # large/slow repo scans that budget exists for. 200s gives headroom above the backend's own
    # 180s ceiling instead of racing it.
    location = /scan-repo {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
    }

    # --- Everything else - general API traffic. -----------------------------------------
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # A couple of the analysis/scan endpoints can take longer than nginx's 60s default
        # on a large file - give the backend real headroom instead of nginx cutting it off
        # mid-request with a 504 while the backend is still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

