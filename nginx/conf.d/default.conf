# StarSage reverse proxy - fronts the FastAPI backend container.
#
# What this does (base setup):
#   - Terminates the connection from the internet and forwards every request to the
#     "backend" service (see ../docker-compose.yml) over the private docker network.
#   - Sends X-Real-IP/X-Forwarded-For/X-Forwarded-Proto so the backend's own rate-limiting
#     (main.py's _get_client_ip()) sees the REAL visitor IP instead of this proxy's IP -
#     the backend's Dockerfile already runs uvicorn with --proxy-headers to trust this.
#   - Raises client_max_body_size above nginx's 1m default. The backend's own middleware
#     rejects any request over 2,000,000 bytes (main.py line ~230) BEFORE reading the body,
#     and each analyze/migrate endpoint further caps the actual file content at 500,000
#     bytes - nginx's default 1m limit would silently 413 a request between 1MB and 2MB
#     before it ever reached the backend's own, more informative JSON error.
#
# Security/hardening additions below (added on top of the base setup):
#   - Nginx-level rate limiting, as a second layer in front of the backend's own
#     per-IP rate limiting (defense in depth - if nginx's limit trips, the backend never
#     even sees the request).
#   - A user-agent block for a few well-known scanner tools. NOTE: this is a weak control by
#     itself (any attacker can fake their User-Agent header in one line) - it only stops the
#     laziest/most automated scans, not a real attacker. Keep the backend's own security
#     scanning/WAF-style defenses as the real control.
#   - Structured (JSON) access logging, a dedicated Nginx-only health endpoint, gzip and
#     keepalive tuning, and tighter/looser per-endpoint request-size and timeout limits based
#     on this API's REAL routes (checked against backend/main.py's actual @app.get/@app.post
#     decorators, not guessed).
#
# This file is plain HTTP (port 80) so it works out of the box with no domain/certificate.
# See the commented-out HTTPS section at the bottom for how to add TLS once you have a real
# domain pointed at this server (DNS A record -> this server's IP).

# --- Rate limiting zones (must live at this "http" context level - conf.d/*.conf files are
# already included inside nginx.conf's http{} block, so this is the correct place) ---------
# api: general/default traffic. ai_endpoints: the two heavier, most expensive-to-run routes
# (/ai-migrate, /generate-tests - both call out to an AI provider). auth: login/register/
# logout - kept in ITS OWN zone (not shared with ai_endpoints) so a burst of AI-migration
# calls from one user can't also throttle their own login attempts, and vice versa.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ai_endpoints:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# --- Bad-bot / scanner user-agent block (weak control, see note above - kept anyway as a
# cheap first filter) ------------------------------------------------------------------------
map $http_user_agent $bad_bot {
    default 0;
    ~*sqlmap   1;
    ~*nikto    1;
    ~*nmap     1;
    ~*masscan  1;
    ~*zgrab    1;
    ~*acunetix 1;
    ~*nessus   1;
}

# --- Structured JSON access log ---------------------------------------------------------
log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"duration":"$request_time",'
    '"user_agent":"$http_user_agent"}';

upstream starsage_backend {
    server backend:8000;
    keepalive 32;  # persistent connections to the backend, reused across requests
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log json_combined;

    client_max_body_size 3m;

    if ($bad_bot) {
        return 403;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Nginx-only health check - does NOT hit the backend, used by orchestrators/uptime
    # monitors that just need to know "is this box's web server alive".
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --- AI-backed endpoints (checked against main.py: @app.post("/ai-migrate"),
    # @app.post("/generate-tests")) - these call out to an external AI provider (see
    # AI_PROVIDER env var), so they're slower and more expensive per-request than the rest of
    # the API. Tighter rate limit, larger body allowance, longer timeout. -------------------
    location ~ ^/(ai-migrate|generate-tests)$ {
        limit_req zone=ai_endpoints burst=3 nodelay;
        client_max_body_size 5m;
        proxy_read_timeout 180s;
        proxy_pass http://starsage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
    }

    # --- Auth endpoints (checked against main.py: @app.post("/auth/register"),
    # @app.post("/auth/login"), @app.post("/auth/logout")) - small payloads only, own rate
    # zone so this can't be starved by, or starve, the AI endpoints above. ------------------
    location ~ ^/auth/ {
        limit_req zone=auth burst=2 nodelay;
        client_max_body_size 100k;
        proxy_pass http://starsage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin/reporting endpoints (main.py: /stats, /audit-log, /audit-log-json,
    # /security-dashboard). NOT IP-restricted yet - add your real admin IP(s) below once you
    # have them, then uncomment the "allow"/"deny" lines. Leaving this open for now (still
    # behind the general rate limit below) rather than guessing a placeholder IP, which would
    # either lock you out (wrong IP) or give a false sense of security (left as a placeholder
    # that never matches your real IP and quietly denies everyone, or worse, denies no one).
    location ~ ^/(stats|audit-log|audit-log-json|security-dashboard)$ {
        # allow YOUR.REAL.IP.HERE;
        # deny all;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://starsage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else - general API traffic. -----------------------------------------
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://starsage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A couple of the analysis/scan endpoints can take longer than nginx's 60s default
        # on a large file - give the backend real headroom instead of nginx cutting it off
        # mid-request with a 504 while the backend is still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

