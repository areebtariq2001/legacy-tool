name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Safety check (known-vulnerable dependency scan)
        working-directory: backend
        run: |
          pip install safety
          safety check -r requirements.txt --continue-on-error
        continue-on-error: true

      - name: Run Bandit (static security analysis of Python code)
        working-directory: backend
        run: |
          pip install bandit
          bandit -r . -ll -x ./tests,./test_starsage.py,./test_regex_patterns.py
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "Security scan complete. Check the Safety and Bandit step logs above for any findings."
          echo "continue-on-error is enabled so this workflow does not block merges yet - once the findings list is clean, remove continue-on-error from both steps to make this a hard gate."