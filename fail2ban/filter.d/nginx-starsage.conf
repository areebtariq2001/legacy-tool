# StarSage custom filter - this reverse proxy logs JSON (log_format json_combined in
# nginx/conf.d/default.conf), not nginx's default "combined" text format, so none of the
# stock nginx-* filters shipped with fail2ban (which expect the plain-text combined format)
# match a single line of this access log at all - they would silently never ban anyone.
# Matches a JSON access-log line whose "status" field is 401 (failed auth), 403 (bad-bot
# block or WAF-style deny), or 429 (nginx rate-limit zone tripped) and extracts "ip" as the
# offending host.
[Definition]
failregex = ^\{"time":"[^"]*","ip":"<HOST>","method":"[^"]*","uri":"[^"]*","status":"(?:401|403|429)",.*\}$
ignoreregex =
