# StarSage: ban an IP that racks up repeated 401/403/429 responses (failed auth, bad-bot/WAF
# block, or rate-limit trip) within a short window - a second, host-level layer of defense on
# top of the backend's own in-process auto-block (main.py's _AUTO_BLOCK_EVENT_TYPES), since
# that one only fires for a few specific application-level event types and can't stop a
# low-and-slow scan that nginx itself is already seeing and logging.
[nginx-starsage]
enabled  = true
filter   = nginx-starsage
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 600
bantime  = 3600
# crazymax/fail2ban's default action (iptables-based) needs NET_ADMIN/NET_RAW and host
# networking to actually install firewall rules - see docker-compose.yml's fail2ban service
# comment for the exact capabilities this requires.
